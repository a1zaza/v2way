name: 发布 v2way 镜像

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: ghcr-publish-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - name: 检出源码
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: 生成镜像地址
        id: image
        shell: bash
        run: |
          printf 'name=ghcr.io/%s:latest\n' "${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: 初始化构建器
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: 登录 GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并发布镜像
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./deploy/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.image.outputs.name }}
          labels: |
            org.opencontainers.image.title=v2way
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=v2way-amd64
          cache-to: type=gha,scope=v2way-amd64,mode=max

      - name: 记录发布结果
        shell: bash
        env:
          IMAGE: ${{ steps.image.outputs.name }}
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            printf '镜像：`%s`\n\n' "$IMAGE"
            printf '源码：`%s`\n\n' "$GITHUB_SHA"
            printf 'Digest：`%s`\n\n' "$DIGEST"
            printf '首次发布后，请在包设置中确认可见性为 Public，并验证匿名拉取。\n'
          } >> "$GITHUB_STEP_SUMMARY"
